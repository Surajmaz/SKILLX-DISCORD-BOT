<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillX Dashboard | Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#5865F2',
                            600: '#4752C4',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #0b0f19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(88, 101, 242, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(155, 89, 182, 0.15) 0px, transparent 50%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100 font-sans antialiased">
    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 shadow-2xl rounded-2xl p-8 relative overflow-hidden">
        <!-- Glow accent -->
        <div class="absolute -top-12 -left-12 w-32 h-32 bg-brand-500/20 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-purple-500/20 rounded-full blur-2xl"></div>

        <div class="relative z-10 text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4 bg-gradient-to-tr from-brand-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg shadow-brand-500/20 border border-white/10">
                <i class="bi bi-robot text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">SkillX Management Console</h1>
            <p class="text-sm text-slate-400 mt-1">Authenticate to access bot diagnostics and controls</p>
        </div>

        <form id="loginForm" class="space-y-5 relative z-10" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                    Master Access Key
                </label>
                <div class="relative">
                    <input 
                        type="password" 
                        id="passwordInput" 
                        required 
                        placeholder="Enter dashboard password..." 
                        autocomplete="current-password"
                        class="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all pr-12"
                    />
                    <button 
                        type="button" 
                        onclick="toggleVisibility()" 
                        class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-200 transition-colors"
                        tabindex="-1"
                        aria-label="Toggle password visibility"
                    >
                        <i id="eyeIcon" class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div id="errorAlert" class="hidden bg-red-500/10 border border-red-500/30 rounded-xl p-3.5 text-xs text-red-400 flex items-center gap-2.5">
                <i class="bi bi-exclamation-triangle-fill text-sm"></i>
                <span id="errorMessage">Invalid password</span>
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-brand-500 hover:bg-brand-600 active:scale-[0.99] text-white font-medium py-3 rounded-xl shadow-lg shadow-brand-500/25 transition-all flex items-center justify-center gap-2 cursor-pointer"
            >
                <span id="btnText">Access Console</span>
                <i id="btnIcon" class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-800 text-center text-xs text-slate-500">
            Protected by HMAC authentication & timing-safe verification
        </div>
    </div>

    <script>
        function toggleVisibility() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById('passwordInput').value;
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');

            errorAlert.classList.add('hidden');
            submitBtn.disabled = true;
            btnText.textContent = 'Verifying...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    window.location.href = '/';
                } else {
                    errorMessage.textContent = data.error || 'Authentication rejected.';
                    errorAlert.classList.remove('hidden');
                }
            } catch (err) {
                errorMessage.textContent = 'Network communication failure. Please check server status.';
                errorAlert.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Access Console';
            }
        }
    </script>
</body>
</html>
